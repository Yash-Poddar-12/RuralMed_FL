schema_version: 1
seed: 42
paths:
  raw: research/data/raw
  processed: research/data/processed/representative
  partitions: research/data/partitions/representative
datasets:
  nih:
    enabled: true
    directory: nih-representative
    expected_images: 1500
    representative_only: true
  covidqu:
    enabled: true
    expected_images: 33920
    expected_classes: {Normal: 10701, Pneumonia: 11263, COVID-19: 11956}
  chexpert: {enabled: false, csv: train.csv, pending_registration: true}
preprocessing:
  image_size: 224
  channels_on_disk: 1
  channels_at_load: 3
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  workers: 8
split:
  train: 0.70
  val: 0.15
  test: 0.15
  preserve_covid_official: true
partition:
  clients: 10
  alpha: 0.5
  source_preference: 0.9
  volume_sigma: 1.0
  min_train_images: 32
tracking:
  uri: sqlite:///research/mlflow.db
  experiment: phase1-representative
  artifacts: research/artifacts/mlflow-representative
