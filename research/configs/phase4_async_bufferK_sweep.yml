schema_version: 1
seed: 42
experiment: phase4-async-fedbuff

# -- Model -------------------------------------------------------------------
model:
  architecture: densenet121
  pretrained: true
  dropout: 0.2
  num_classes: 3

# -- Training (local, per-client per-round) ----------------------------------
training:
  local_epochs: 1
  batch_size: 16
  optimizer: adam
  learning_rate: 0.0001
  weight_decay: 0.0001
  use_amp: true

# -- Federated learning ------------------------------------------------------
federated:
  rounds: 100
  # Slightly over-select (60%) so the buffer has enough candidates to fill
  # even under dropout.  Survivors fill the buffer; extras are discarded.
  fraction_fit: 0.6
  fraction_evaluate: 0.0

# -- Phase 4 async aggregation -----------------------------------------------
async:
  strategy: fedbuff           # "fedbuff" | "sync_dropout"

  # Buffer size sweep — run this config once per K value.
  # Recommended sweep: K in [1, 3, 5]
  buffer_size: 3              # K: number of updates to buffer before aggregating

  staleness_alpha: 0.5        # (1 + staleness)^{-alpha} weighting exponent

# -- Dropout / straggler model -----------------------------------------------
straggler:
  # Per-round dropout probability.
  # For the buffer-size sweep, fix a representative value.
  dropout_prob: 0.25          # 25% of selected clients drop each round

  # Lognormal delay parameters (for diagnostics / Phase 5 compatibility)
  delay_mu: 0.0
  delay_sigma: 0.5

  # Link dropout probability to client data volume (True = more defensible)
  size_correlated: true
  size_scale: 0.3             # max additive dropout probability from volume

  seed: 42

# -- Compression (composable with Phase 3 — set enabled: false to disable) --
compression:
  enabled: false              # set to true to validate Phase 3 + Phase 4 jointly
  method: topk
  topk_ratio: 0.05
  warmup_rounds: 5
  warmup_ratio: 0.25
  error_feedback: true
  quant_bits: 8

# -- Data (matches Phase 1 public cohort) ------------------------------------
data:
  cohort: public
  clients: 10
  class_weights: [0.555, 1.116, 3.299]

# -- Hardware resource allocation --------------------------------------------
hardware:
  gpus_per_client: 0.5
  cpus_per_client: 2

# -- MLflow tracking ---------------------------------------------------------
tracking:
  uri: file:research/artifacts/mlruns
  experiment: phase4-async-fedbuff
  artifacts: research/artifacts/mlflow
