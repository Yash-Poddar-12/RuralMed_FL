schema_version: 1
seed: 42
experiment: phase2-fedavg-baseline

# -- Model -------------------------------------------------------------------
model:
  architecture: densenet121
  pretrained: true
  dropout: 0.2
  num_classes: 3

# -- Training (local, per-client per-round) ----------------------------------
training:
  local_epochs: 1
  batch_size: 16
  optimizer: adam
  learning_rate: 0.0001
  weight_decay: 0.0001
  use_amp: true

# -- Federated learning ------------------------------------------------------
federated:
  rounds: 100
  fraction_fit: 0.5
  fraction_evaluate: 0.0

# -- Data (matches Phase 1 public cohort) ------------------------------------
data:
  cohort: public
  clients: 10
  # Global class weights: total / (n_classes * count_c)
  # Normal: 71062, Pneumonia: 35347, COVID-19: 11956, total: 118365
  class_weights: [0.555, 1.116, 3.299]

# -- Hardware resource allocation for Flower simulation ----------------------
hardware:
  gpus_per_client: 0.5
  cpus_per_client: 2

# -- MLflow tracking (same store as Phase 1) ---------------------------------
tracking:
  uri: file:research/artifacts/mlruns
  experiment: phase2-fedavg-baseline
  artifacts: research/artifacts/mlflow
